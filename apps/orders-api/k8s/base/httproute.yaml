# ${TENANT} is filled in by Flux postBuild substitution (tenants/<team>/sync.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-api
spec:
  parentRefs:
    - name: shared
      namespace: infra-gateway
      sectionName: http
  hostnames:
    - ${TENANT}.orders.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: orders-api
          port: 80
