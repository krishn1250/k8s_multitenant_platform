# Vault path tenants/<tenant>/orders-api -> Kubernetes Secret orders-api-secrets.
# The app only ever sees a normal Secret; it does not know Vault exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-api
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: orders-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: ${TENANT}/orders-api
        property: API_KEY
