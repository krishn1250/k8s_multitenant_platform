apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - hpa.yaml
images:
  - name: ghcr.io/YOUR_GITHUB_USER/orders-api
    newTag: 0.1.0   # promoted by pull request, not by automation
patches:
  - target:
      kind: Deployment
      name: orders-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
  - target:
      kind: PodDisruptionBudget
      name: orders-api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
