apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-b
resources:
  - namespace.yaml
  - ../base
  - access.yaml
  - sync.yaml
patches:
  - target:
      kind: SecretStore
      name: vault
    patch: |-
      - op: replace
        path: /spec/provider/vault/auth/kubernetes/role
        value: team-b
