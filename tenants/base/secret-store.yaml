# Each tenant logs in to Vault with its own Kubernetes role. The Vault policy
# behind that role only allows tenants/data/<tenant>/*, so team-b cannot read
# team-a secrets even if it asks for them by name.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: tenants
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: TENANT_ROLE   # patched per tenant
          serviceAccountRef:
            name: vault-reader
