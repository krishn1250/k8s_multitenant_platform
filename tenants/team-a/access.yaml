# Humans: members of the team-a group get "edit" in their namespace only.
# On AKS this subject would be an Entra ID group object ID; locally it is a
# plain group name you can test with: kubectl auth can-i --as=dev --as-group=team-a ...
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-a-developers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: team-a
---
# Read-only view across the namespace for on-call from other teams.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oncall-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: sre-oncall
