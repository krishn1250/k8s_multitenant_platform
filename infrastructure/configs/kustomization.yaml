apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
  - platform-alerts.yaml
  - flux-podmonitor.yaml

# Grafana's sidecar loads any ConfigMap with grafana_dashboard: "1".
configMapGenerator:
  - name: dashboard-orders-api-slo
    namespace: monitoring
    files:
      - dashboards/orders-api-slo.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
