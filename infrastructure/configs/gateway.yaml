# One shared Gateway, owned by the platform team. Tenants attach HTTPRoutes to it
# but only from namespaces labelled platform.io/tenant=true, so a random
# namespace cannot hijack traffic.
apiVersion: v1
kind: Namespace
metadata:
  name: infra-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
  namespace: infra-gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.orders.local"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.io/tenant: "true"
